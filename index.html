<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f3f0" />
    <title>Зетфликс — аналитика</title>
    <script>
      // Apply the saved (or OS) appearance before the first paint.
      (() => {
        let saved;
        try {
          saved = localStorage.getItem('zetflix.theme');
        } catch {
          // Storage can be blocked.
        }
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#workspace-panel">К графикам</a>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Зетфликс, главная"
        ><span class="brand-mark" aria-hidden="true">Z</span>Зетфликс
      </a>
      <div class="top-actions">
        <span id="save-state" role="status"></span
        ><button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="Переключить тему"
        ></button
        ><button id="edit-btn" aria-pressed="false">Настроить</button>
        <details class="app-menu">
          <summary
            class="menu-trigger"
            aria-label="Действия с пространствами"
            title="Действия с пространствами"
          >
            <span aria-hidden="true">···</span>
          </summary>
          <div class="menu-content">
            <button id="rename-space">Переименовать</button
            ><button id="export-btn">Экспорт пространств</button
            ><button id="import-btn">Импорт пространств</button
            ><button id="delete-space" class="danger">Удалить пространство</button>
          </div>
        </details>
        <input type="file" id="import-file" accept="application/json,.json" hidden />
      </div>
    </header>
    <main>
      <div class="workspace-toolbar">
        <nav class="space-navigation" aria-label="Пространства">
          <div id="space-tabs" role="tablist" aria-label="Пространства"></div>
          <button
            id="create-space"
            class="add-space"
            aria-label="Создать пространство"
            title="Создать пространство"
          >
            +
          </button>
        </nav>
        <div class="period-controls" role="group" aria-label="Период анализа">
          <span class="period-caption">Период</span>
          <div id="period-picker" class="period-picker">
            <button
              id="period-trigger"
              type="button"
              aria-haspopup="dialog"
              aria-controls="period-panel"
              aria-expanded="false"
            ></button>
            <div
              id="period-panel"
              class="period-popover"
              role="dialog"
              aria-label="Выбрать интервал месяцев"
              hidden
            >
              <div class="period-popover-top">
                <strong>Период анализа</strong>
                <span id="period-step" role="status"></span>
              </div>
              <div class="period-presets" aria-label="Готовые периоды">
                <button type="button" data-period-preset="all">Весь период</button>
                <button type="button" data-period-preset="2024">2024</button>
                <button type="button" data-period-preset="2025">2025</button>
              </div>
              <div id="period-months" class="period-years"></div>
              <div class="period-popover-actions">
                <button type="button" id="period-cancel">Отмена</button>
                <button type="button" class="primary" id="period-apply">Применить</button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div
        id="editor-bar"
        class="editor-bar"
        role="toolbar"
        aria-label="Редактирование дашборда"
        hidden
      >
        <button id="add-btn" class="primary" type="button">Добавить график</button>
        <button id="add-heading-btn" type="button">Добавить заголовок</button>
        <span class="editor-separator" aria-hidden="true"></span>
        <button
          id="undo-btn"
          class="editor-icon"
          type="button"
          aria-label="Отменить"
          title="Отменить"
        ></button>
        <button
          id="redo-btn"
          class="editor-icon"
          type="button"
          aria-label="Повторить"
          title="Повторить"
        ></button>
      </div>
      <p id="message" class="message" role="status" aria-live="polite" hidden></p>
      <section id="workspace-panel" role="tabpanel" tabindex="0">
        <div id="dashboard-grid" class="grid-stack"></div>
        <div id="empty-layout" class="empty-state" hidden>
          <span class="empty-mark" aria-hidden="true">Z</span>
          <h1 id="empty-title">Пространство для ваших данных</h1>
          <p id="empty-description">
            Добавьте графики из каталога. Макет можно менять в любой момент.
          </p>
          <button id="empty-action" class="primary">Добавить график</button>
        </div>
      </section>
    </main>
    <dialog id="heading-dialog">
      <form id="heading-form">
        <h2 id="heading-dialog-title">Заголовок</h2>
        <label for="heading-text">Текст заголовка</label>
        <input id="heading-text" maxlength="100" autocomplete="off" required />
        <div class="dialog-actions">
          <button id="cancel-heading" type="button">Отмена</button>
          <button class="primary" type="submit">Сохранить</button>
        </div>
      </form>
    </dialog>
    <dialog id="catalog">
      <form method="dialog" class="dialog-heading">
        <div>
          <h2>Добавить график</h2>
          <p>Выберите визуализацию для этого пространства</p>
        </div>
        <button aria-label="Закрыть каталог">×</button>
      </form>
      <input
        id="catalog-search"
        type="search"
        placeholder="Поиск по названию или C-ID"
        aria-label="Найти график"
      />
      <div id="catalog-items"></div>
      <p id="catalog-empty" hidden>Графики не найдены.</p>
    </dialog>
    <dialog id="space-dialog">
      <form id="space-form">
        <h2 id="space-dialog-title">Новое пространство</h2>
        <label for="space-name">Название</label
        ><input id="space-name" maxlength="80" required autocomplete="off" />
        <div class="dialog-actions">
          <button id="cancel-space" type="button">Отмена</button
          ><button class="primary" type="submit">Сохранить</button>
        </div>
      </form>
    </dialog>
    <dialog id="confirm-dialog">
      <form method="dialog">
        <h2 id="confirm-title"></h2>
        <p id="confirm-text"></p>
        <div class="dialog-actions">
          <button value="cancel">Отмена</button
          ><button value="confirm" class="danger">Продолжить</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
