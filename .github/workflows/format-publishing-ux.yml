name: Format publishing UX branch
on:
  push:
    branches:
      - admin/clear-workspace-save-publish-20261115
permissions:
  contents: write
jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[format]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/main.js src/layout/WorkspaceChanges.js src/layout/WorkspacePublishingUI.js src/style.css tests/browser/dashboard.spec.js tests/workspace-changes.test.js vite.config.js index.html
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main.js src/layout/WorkspaceChanges.js src/layout/WorkspacePublishingUI.js src/style.css tests/browser/dashboard.spec.js tests/workspace-changes.test.js vite.config.js index.html
            git commit -m "Format workspace publishing UX [format]"
            git push
          fi
