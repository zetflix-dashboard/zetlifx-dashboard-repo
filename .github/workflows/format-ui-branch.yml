name: Format UI refactor branch
on:
  push:
    branches: [admin/resize-theme-controls]
    paths:
      - .github/workflows/format-ui-branch.yml
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'zetflix-dashboard/zetlifx-dashboard-repo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/layout/GridManager.js src/main.js src/style.css src/shared/ui/icons.js src/shared/ui/theme.js src/shared/charts/templates.js src/shared/charts/ChartManager.js tests/browser/dashboard.spec.js index.html
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/layout/GridManager.js src/main.js src/style.css src/shared/ui/icons.js src/shared/ui/theme.js src/shared/charts/templates.js src/shared/charts/ChartManager.js tests/browser/dashboard.spec.js index.html
          if ! git diff --cached --quiet; then
            git commit -m "style: apply project Prettier formatting"
            git push origin HEAD:admin/resize-theme-controls
          fi
