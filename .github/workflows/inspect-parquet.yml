name: Inspect analytics Parquet schemas
on:
  push:
    branches: [admin/oled-ui-and-c15-c20-c14]
    paths:
      - .github/workflows/inspect-parquet.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pyarrow
      - name: Verify schemas and categories (no raw user records)
        run: |
          python - <<'PY'
          import pyarrow.parquet as pq
          from collections import Counter
          from pathlib import Path
          files = ['users','viewing_daily','billing_events','content_titles','content_amortization','subscriptions','rentals','refunds','marketing_spend','cost_allocations']
          for name in files:
              path = Path('public/data') / (name + '.parquet')
              if not path.exists(): continue
              metadata = pq.ParquetFile(path)
              print('\n===', name, 'rows', metadata.metadata.num_rows, '===')
              print(metadata.schema_arrow)
              cols = [c for c in metadata.schema_arrow.names if any(k in c.lower() for k in ['status','type','reason','access','origin','is_test','is_original','payment','period','watch','genre','plan_id','view_date','event_date'])]
              for col in cols:
                  if col.endswith('_id') and col not in ('plan_id',): continue
                  try:
                      values = pq.read_table(path, columns=[col]).column(col).to_pylist()
                      cnt = Counter(str(v) for v in values)
                      if len(cnt) <= 25: print('  DISTRIBUTION', col, cnt.most_common(25))
                      elif 'date' in col or 'period' in col: print('  RANGE', col, min(str(v) for v in values if v is not None), max(str(v) for v in values if v is not None))
                  except Exception as e: print('  COLUMN ERROR',col, str(e)[:200])
          PY
