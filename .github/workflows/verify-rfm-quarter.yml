name: One-time validate RFM metrics and C03 quarter
on:
  push:
    branches: [admin/rfm-metrics-chart-ids-c03-quarter]
    paths: [.github/workflows/verify-rfm-quarter.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - run: pip install -q duckdb
      - name: Format updated source files
        run: npx prettier --write src/shared/data/datasets.js src/layout/GridManager.js src/style.css src/charts/C03-financial-trend/chart.json src/charts/C20-rfm/chart.json tests/local-filters.test.js tests/browser/dashboard.spec.js
      - name: Compile and cross-check real Parquet SQL
        run: |
          node --input-type=module -e "import {datasets} from './src/shared/data/datasets.js';import {writeFileSync} from 'node:fs';writeFileSync('/tmp/queries.json',JSON.stringify({c03:datasets.financialMonthly.sql,c20:datasets.rfmSnapshot.sql}))"
          python - <<'PY'
          import duckdb,json,os,math
          os.chdir('public/data')
          con=duckdb.connect()
          sql=json.load(open('/tmp/queries.json'))
          all_rows=con.execute(sql['c03'],['2024-01-01','2025-12-01','all']).fetchall()
          q1=con.execute(sql['c03'],['2024-01-01','2025-12-01','1']).fetchall()
          print('C03 months:', len(all_rows), 'Q1:', len(q1))
          assert len(all_rows)==24 and len(q1)==6
          assert all(int(r[0][5:7]) in (1,2,3) for r in q1)
          for r in q1: assert r in all_rows
          rows=con.execute(sql['c20']).fetchall()
          names=[d[0] for d in con.description]
          print('C20 rows:',len(rows),'fields:',names)
          assert len(rows)>0
          assert {'segment','users','user_share_pct','revenue','share_pct','revenue_per_user','avg_paid_months','avg_days_since_view','never_viewed_users'} <= set(names)
          records=[dict(zip(names,r)) for r in rows]
          assert abs(sum(r['user_share_pct'] for r in records)-100) < 1e-8
          assert abs(sum(r['share_pct'] for r in records)-100) < 1e-8
          for r in records:
              assert r['users'] > 0
              assert abs(r['revenue_per_user']*r['users']-r['revenue']) < 1e-5
              assert r['never_viewed_users'] <= r['users']
              assert r['avg_paid_months']>=0
              if r['avg_days_since_view'] is not None: assert r['avg_days_since_view']>=0
          print('C20 total users:',sum(r['users'] for r in records))
          PY
      - run: npm run check
      - name: Commit source formatting if necessary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if ! git diff --cached --quiet; then
            git commit -m "style: apply project formatting to RFM and C03 changes"
            git push origin HEAD:admin/rfm-metrics-chart-ids-c03-quarter
          fi
